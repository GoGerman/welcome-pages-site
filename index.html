<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="index.title">Chrome extension guides</title>
  <style>
    :root {
      color-scheme: light;
      color: #182638;
      background: #eef2f7;
      font: 16px/1.5 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(16px, 5vw, 60px); }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 40px);
      border: 1px solid #cdd7e3;
      border-radius: 16px;
      background: #fff;
    }
    h1 { margin: 0 0 20px; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; }
    ul { margin: 0; padding: 0; list-style: none; }
    li + li { margin-top: 8px; }
    a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #245ca0;
      background: #f5f8fc;
      font-weight: 600;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    a:focus-visible { outline: 3px solid #245ca0; outline-offset: 2px; }
    img { flex: none; }
  </style>
  <link rel="stylesheet" href="./assets/locale.css">
  <script src="./assets/welcome.js" type="module"></script>
</head>
<body>
  <main>
    <header class="index-header">
      <h1 data-i18n="index.heading">Chrome extension guides</h1>
      <div class="language-picker" data-language-picker hidden>
        <span id="language-label" data-i18n="common.language.label">Language</span>
        <select data-language-select aria-labelledby="language-label">
          <option value="auto" data-i18n="common.language.auto">Browser default</option>
        </select>
      </div>
    </header>
    <p class="language-status" data-language-status data-i18n="common.language.fallback" role="status" hidden>Some of this guide is shown in English.</p>
    <nav aria-label="Welcome Page for each extension" data-i18n-aria-label="index.navigation">
      <ul>
        <li><a href="./meta/" data-language-link><img src="./assets/meta.png" width="36" height="36" alt=""><span data-i18n="meta.name">Meta Tag Analyzer</span></a></li>
        <li><a href="./etsy/" data-language-link><img src="./assets/etsy.png" width="36" height="36" alt=""><span data-i18n="etsy.name">Etsy Scraper</span></a></li>
        <li><a href="./apa/" data-language-link><img src="./assets/apa.png" width="36" height="36" alt=""><span data-i18n="apa.name">APA Website Citation Generator</span></a></li>
        <li><a href="./pdf/" data-language-link><img src="./assets/pdf.png" width="36" height="36" alt=""><span data-i18n="pdf.name">Remove Blank Pages from PDF</span></a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
